apiVersion: apps/v1
kind: Deployment
metadata:
  name: headless-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web-cont
        image: nginx
        ports:
        - containerPort: 80
