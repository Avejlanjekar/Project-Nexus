apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: avej-rs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: avej-rs
          image: nginx
          ports:
            - containerPort: 80
