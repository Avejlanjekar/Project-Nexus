apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudethix-nginx-deploy
  namespace: cloudethix-avej
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: cloudethix-nginx
          image: avejlanjekar45/cloudethix-nginix-avej
          ports:
            - containerPort: 80
