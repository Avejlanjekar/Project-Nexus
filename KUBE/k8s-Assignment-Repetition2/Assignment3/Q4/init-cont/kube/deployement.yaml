apiVersion: apps/v1
kind: Deployment
metadata:
  name: simpleapp-webapp-deployment
spec:
  selector:
    matchLabels:
      app: simpleapp-webapp 
  replicas: 3
  template:
    metadata:
      labels:
        app: simpleapp-webapp 
    spec:
      initContainers:
        - name: install
          image: busybox:1.28
          command:
            - wget
            - -O
            - /work-dir/index.html
            - http://info.cern.ch
          volumeMounts:
            - name: workdir
              mountPath: /work-dir
      containers:
        - name: simpleapp-webapp 
          image: avejlanjekar45/cloudethix_initcontainer_avej
          ports:
            - containerPort: 80
          volumeMounts:
            - name: workdir
              mountPath: /usr/share/nginx/htm
      volumes:
        - name: workdir
          emptyDir: {}
