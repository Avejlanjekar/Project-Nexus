apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4-backend-deployment
  namespace: app4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: avejlanjekar45/react-rust-postgres-backend
          ports:
            - containerPort: 8000
          env:
            - name: ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: app4-cm
                  key: ADDRESS

            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: app4-cm
                  key: RUST_LOG

            - name: PG_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: app4-cm
                  key: PG_DBNAME

            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: app4-cm
                  key: PG_HOST

            - name: PG_USER
              valueFrom:
                configMapKeyRef:
                  name: app4-cm
                  key: PG_USER

            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app4-secret
                  key: PG_PASSWORD
