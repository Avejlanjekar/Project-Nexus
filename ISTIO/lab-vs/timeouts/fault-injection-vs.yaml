apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: slow-backend-fault
  namespace: istio-demo
spec:
  hosts:
    - slow-backend
  http:
    - fault:
        delay:
          percentage:
            value: 100
          fixedDelay: 5s

      route:
        - destination:
            host: slow-backend
            port:
              number: 80
