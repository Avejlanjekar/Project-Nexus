apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-deployment
  namespace: istio-demo
spec:
  selector:
    matchLabels:
      app: slow-backend
  replicas: 1
  template:
    metadata:
      labels:
        app: slow-backend
    spec:
      containers:
        - name: slow-backend
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              import time
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      time.sleep(10)
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"Slow backend response")

              HTTPServer(("0.0.0.0", 80), Handler).serve_forever()
          ports:
            - containerPort: 80
