apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: istio-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: hashicorp/http-echo
          args:
            - "-text=Database response"
          ports:
            - containerPort: 5678
