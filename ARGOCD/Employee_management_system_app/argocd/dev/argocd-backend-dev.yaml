apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-management-backend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Avejlanjekar/employee-management-helm-cicd.git
    targetRevision: main
    path: helm/employee-management
    helm:
      valueFiles:
        - values-dev.yaml
      parameters:
        - name: component
          value: backend
  destination:
    server: https://54CC3ED28874F48406409F68D03B1EC0.gr7.ap-south-1.eks.amazonaws.com
    namespace: employee-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true