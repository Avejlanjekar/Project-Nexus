{{- if or (eq .Values.component "all") (eq .Values.component "database")}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.service.name }}
spec:
  selector:
    app: {{ .Values.database.labels.app }}
  ports:
    - port: {{ .Values.database.service.port }}
      targetPort: {{ .Values.database.containerPort }}
{{- end}}