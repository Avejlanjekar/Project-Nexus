{{- if or (eq .Values.component "all") (eq .Values.component "backend") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.deployment.name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.backend.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.labels.app }}
    spec:
      containers:
        - name: {{ .Values.backend.containerName }}
          image: "{{ .Values.backend.image.repository }}-{{ .Values.global.environment }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: {{ .Values.backend.config.DB_HOST}}
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.backend.config.configMapName }}
                  key: {{ .Values.backend.config.env.DB_HOST.key }}

            - name: {{ .Values.backend.config.DB_PORT}}
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.backend.config.configMapName }}
                  key: {{ .Values.backend.config.env.DB_PORT.key }}

            - name: {{ .Values.backend.config.DB_USER}}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.config.secretName }}
                  key: {{ .Values.backend.config.env.DB_USER.key }}

            - name: {{ .Values.backend.config.DB_PASSWORD}}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.config.secretName }}
                  key: {{ .Values.backend.config.env.DB_PASSWORD.key }}
                  
            - name: {{ .Values.backend.config.DB_NAME }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.config.secretName }}
                  key: {{ .Values.backend.config.env.DB_NAME.key }}
{{- end }}