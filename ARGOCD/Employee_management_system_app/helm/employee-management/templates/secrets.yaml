{{- if or (eq .Values.component "all") (eq .Values.component "config")}}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ .Values.secret.MYSQL_ROOT_PASSWORD | quote }}
  MYSQL_DATABASE: {{ .Values.secret.MYSQL_DATABASE | quote }}
  MYSQL_USER: {{ .Values.secret.MYSQL_USER | quote }}
  MYSQL_PASSWORD: {{ .Values.secret.MYSQL_PASSWORD | quote }}
{{- end}}