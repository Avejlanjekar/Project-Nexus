{{- if or (eq .Values.component "all") (eq .Values.component "database")}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.database.deployment.name }}
spec:
  replicas: {{ .Values.database.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.database.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.database.labels.app }}
    spec:
      containers:
        - name: {{ .Values.database.containerName }}
          image: "{{ .Values.database.image.repository }}-{{ .Values.global.environment }}:{{ .Values.database.image.tag }}"
          ports:
            - containerPort: {{ .Values.database.containerPort }}
          env:
            - name: {{ .Values.database.env.MYSQL_ROOT_PASSWORD.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.env.secretName }}
                  key: {{ .Values.database.env.MYSQL_ROOT_PASSWORD.key }}

            - name: {{ .Values.database.env.MYSQL_DATABASE.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.env.secretName }}
                  key: {{ .Values.database.env.MYSQL_DATABASE.key }}

            - name: {{ .Values.database.env.MYSQL_USER.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.env.secretName }}
                  key: {{ .Values.database.env.MYSQL_USER.key }}

            - name: {{ .Values.database.env.MYSQL_PASSWORD.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.env.secretName }}
                  key: {{ .Values.database.env.MYSQL_PASSWORD.key }}
{{- end}}