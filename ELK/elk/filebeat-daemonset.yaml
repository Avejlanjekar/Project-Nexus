apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: logging
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat

    spec:
      serviceAccountName: filebeat

      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.5.1
          args:
            - "-c"
            - "/etc/filebeat.yml"
            - "-e"

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          securityContext:
            runAsUser: 0

          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml

            - name: varlogcontainers
              mountPath: /var/log/containers

            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true

            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: filebeat-config

        - name: varlogcontainers
          hostPath:
            path: /var/log/containers

        - name: varlogpods
          hostPath:
            path: /var/log/pods

        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers

